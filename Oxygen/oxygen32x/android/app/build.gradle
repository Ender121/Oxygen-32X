plugins {
    id 'com.android.application'
}

android {
    namespace 'org.oxygen32x'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'org.oxygen32x.player'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
        externalNativeBuild {
            cmake {
                // Always optimised: the CPU cores are interpreters.
                arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_static',
                        "-DO32X_GENERATED_DIR=${project.findProperty('o32xGenerated') ?: ''}"
                targets 'main', 'SDL2'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java',
                            '../../../../framework/external/sdl/SDL2/android-project/app/src/main/java']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError false
    }
}
