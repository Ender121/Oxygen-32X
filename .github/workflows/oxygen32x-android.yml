name: oxygen32x Android APK

on:
  push:
    branches: [ "32x-*", main ]
    paths: [ "Oxygen/oxygen32x/**", "framework/external/sdl/**", ".github/workflows/oxygen32x-android.yml" ]
  workflow_dispatch:

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: |
          cmake -S Oxygen/oxygen32x -B build -DCMAKE_BUILD_TYPE=Release -DOXYGEN32X_BUILD_PLAYER=OFF
          cmake --build build -j4
          ./build/oxygen32x_tests

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK and CMake
        run: |
          # The runner image already ships the Android SDK; just add what we need.
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          validate-wrappers: false  # SDL2 ships its own (unused) wrapper jar
      - name: Recompile the game to C++ (host)
        run: |
          # The user's ROM lives in the repo (zip); the generated code is not committed.
          mkdir -p rom && unzip -o "Chaotix ~ Knuckles Chaotix (Japan USA).zip" -d rom
          ROM="$(ls rom/*.32x | head -n1)"
          cmake -S Oxygen/oxygen32x -B hostbuild -DCMAKE_BUILD_TYPE=Release -DOXYGEN32X_BUILD_PLAYER=OFF
          cmake --build hostbuild --target oxygen32x_recomp -j4
          COV=""; for f in Oxygen/oxygen32x/coverage/*.cov; do COV="$COV --coverage $f"; done
          ./hostbuild/oxygen32x_recomp --rom "$ROM" $COV --out "$PWD/generated"
      - name: Build debug APK
        working-directory: Oxygen/oxygen32x/android
        run: gradle --no-daemon assembleDebug -Po32xGenerated="$GITHUB_WORKSPACE/generated"
      - uses: actions/upload-artifact@v4
        with:
          name: oxygen32x-debug-apk
          path: Oxygen/oxygen32x/android/app/build/outputs/apk/debug/*.apk
